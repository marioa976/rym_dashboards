; Configuración PHP por carpeta (funciona con PHP-FPM, CGI y mod_php).
; PHP lee este archivo automáticamente cada 5 minutos por default.
; Si los cambios no se aplican de inmediato, reinicia Apache en MAMP.

upload_max_filesize = 64M
post_max_size       = 64M
memory_limit        = 512M
max_execution_time  = 300
max_input_time      = 300
